<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT — Machine Learning Engineer</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --text-primary: #111827;
            --text-secondary: #1E293B;
            --accent: #2563EB;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-family);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            margin-bottom: 4rem;
        }

        .monogram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.25rem;
            height: 3.25rem;
            background-color: var(--text-secondary);
            color: var(--bg);
            font-weight: 700;
            font-size: 1.125rem;
            letter-spacing: 0.05em;
            border-radius: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .role-badge {
            display: block;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.875rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            letter-spacing: -0.02em;
            margin-bottom: 1.25rem;
        }

        .claim {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.5;
            max-width: 580px;
        }

        main {
            margin-bottom: 4rem;
        }

        .status-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            background-color: #10B981;
            border-radius: 50%;
        }

        .status-title {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .status-desc {
            font-size: 0.9375rem;
            color: #475569;
        }

        footer {
            border-top: 1px solid #E2E8F0;
            padding-top: 1.5rem;
            font-size: 0.875rem;
            color: #64748B;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 2rem 1.25rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            .claim {
                font-size: 1.125rem;
            }
            header {
                margin-bottom: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="monogram">UT</div>
            <span class="role-badge">Machine Learning / ML Engineer</span>
            <h1>I build practical machine learning solutions that solve real business problems.</h1>
        </header>

        <main>
            <div class="status-card">
                <div class="status-header">
                    <span class="status-dot"></span>
                    <span class="status-title">System Status</span>
                </div>
                <p class="status-desc">Portfolio deployment live. Full case studies and production project documentation currently in development.</p>
            </div>
        </main>

        <footer>
            <span>© 2026 UT</span>
            <span>Machine Learning & Search Intelligence</span>
        </footer>
    </div>
</body>
</html>
